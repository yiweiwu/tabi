name: Unit Tests

on:
  pull_request:
    branches: [main]

# Without this, pushing a new commit to a PR starts a new run alongside
# whatever's still running from the previous push instead of replacing it -
# exactly how two overlapping runs ended up stuck in progress at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    # A full cold build (no cache hit) has taken up to ~18 minutes; a hung
    # run has been observed sitting well past that with zero log output -
    # this bounds it so a future hang fails clearly instead of running (and
    # burning CI minutes) indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # GoogleService-Info.plist and Config.swift are both gitignored
      # (per-developer secrets, see CLAUDE.md) but required just to compile
      # and launch the app target that hosts TabiTests. Neither test suite
      # actually calls live Firebase or Gemini, so dummy values are fine -
      # this would need to become real credentials if that ever changes.
      - name: Write dummy per-developer config files
        run: |
          cp .github/ci/GoogleService-Info.plist Tabi/GoogleService-Info.plist
          cp .github/ci/Config.swift Tabi/Config.swift

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available iOS -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "error: no available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Firebase's SPM dependency graph (Firestore, Auth, gRPC, abseil,
      # leveldb, nanopb...) is large - without this, every run re-downloads
      # it from scratch, which is most of why a cold run takes 15-20+
      # minutes. -clonedSourcePackagesDirPath below gives it a stable path
      # to cache instead of a random per-run DerivedData location.
      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('Tabi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests
        run: |
          xcrun xcodebuild test \
            -scheme Tabi \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -clonedSourcePackagesDirPath .spm-cache \
            -only-testing:TabiTests
